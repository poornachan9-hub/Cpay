version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cryptopay-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cryptopay
      POSTGRES_PASSWORD: cryptopay_secret
      POSTGRES_DB: cryptopay
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql

volumes:
  pgdata:
